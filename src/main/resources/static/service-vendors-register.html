<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Vendor Category Registration — Entertainment World</title>
    <link rel="stylesheet" href="/css/auth.css?v=4">
</head>
<body>
    <nav class="ew-navbar">
        <a href="/index.html" class="ew-brand">
            <span class="ew-logo-box">★</span>
            <span class="ew-brand-text">
                <strong>Entertainment World</strong>
                <span>SERVICE VENDOR REGISTRATION</span>
            </span>
        </a>
        <div class="ew-nav-links">
            <a href="/index.html">All Modules</a>
            <a href="/vendors-login.html">Vendor Login</a>
            <a href="/pricing.html">Pricing</a>
        </div>
        <div class="ew-nav-actions">
            <a href="/vendors-login.html" class="ew-btn-outline">Sign In</a>
        </div>
    </nav>

    <main class="auth-page" style="max-width: 860px;">
        <section class="auth-card">
            <a href="/vendors-login.html" class="back-link">&larr; Back to Vendor Login</a>
            <header class="brand-header">
                <div class="brand-badge" aria-hidden="true">SV</div>
                <h1>Register New Vendor Category</h1>
                <p class="brand-subtitle">Production, Post-Production, Audio, Lighting, Art/Costume, Logistics &amp; Marketing Partners</p>
            </header>

            <div id="cat-reg-banner" class="status-banner" role="alert" hidden></div>

            <form id="cat-reg-form" class="auth-form" novalidate>
                <div class="field-group">
                    <label for="cr-category">Vendor Type (Category) *</label>
                    <select id="cr-category" required>
                        <option value="">-- Select Vendor Category --</option>
                        <option value="Production &amp; Camera Services">1. Production &amp; Camera Services</option>
                        <option value="Video Editing &amp; Post-Production">2. Video Editing &amp; Post-Production</option>
                        <option value="Audio &amp; Music Production">3. Audio &amp; Music Production</option>
                        <option value="Lighting &amp; Equipment Rental">4. Lighting &amp; Equipment Rental</option>
                        <option value="Art, Set, Costume &amp; Makeup">5. Art, Set, Costume &amp; Makeup</option>
                        <option value="Event &amp; Logistics Services">6. Event &amp; Logistics Services</option>
                        <option value="Marketing &amp; Promotion Services">7. Marketing &amp; Promotion Services</option>
                        <option value="Other Entertainment Services">8. Other Entertainment Services</option>
                    </select>
                </div>

                <div class="field-row">
                    <div class="field-group"><label for="cr-biz">Business / Company Name *</label><input type="text" id="cr-biz" required></div>
                    <div class="field-group"><label for="cr-person">Contact Person *</label><input type="text" id="cr-person" required></div>
                </div>
                <div class="field-row">
                    <div class="field-group"><label for="cr-email">Email *</label><input type="email" id="cr-email" required></div>
                    <div class="field-group"><label for="cr-phone">Mobile Number *</label><input type="tel" id="cr-phone" required></div>
                </div>
                <div class="field-row">
                    <div class="field-group"><label for="cr-pass">Password *</label><input type="password" id="cr-pass" minlength="6" required></div>
                    <div class="field-group"><label for="cr-cpass">Confirm Password *</label><input type="password" id="cr-cpass" minlength="6" required></div>
                </div>
                <div class="field-group"><label for="cr-logo">Business Logo (Image)</label><input type="file" id="cr-logo" accept="image/*"></div>

                <div class="field-row">
                    <div class="field-group"><label for="cr-country">Country *</label><input type="text" id="cr-country" value="India" required></div>
                    <div class="field-group"><label for="cr-state">State *</label><input type="text" id="cr-state" required></div>
                </div>
                <div class="field-row">
                    <div class="field-group"><label for="cr-city">City *</label><input type="text" id="cr-city" required></div>
                    <div class="field-group"><label for="cr-area">Area / Locality *</label><input type="text" id="cr-area" required></div>
                </div>
                <div class="field-group"><label for="cr-addr">Complete Address *</label><textarea id="cr-addr" rows="2" required></textarea></div>
                <div class="field-row">
                    <div class="field-group"><label for="cr-pin">PIN Code *</label><input type="text" id="cr-pin" required></div>
                    <div class="field-group"><label for="cr-map">Google Maps Location URL *</label><input type="url" id="cr-map" placeholder="https://maps.google.com/?q=..." required></div>
                </div>
                <div class="field-group"><label for="cr-about">About Business *</label><textarea id="cr-about" rows="3" required></textarea></div>

                <div id="cat-specific-fields" style="background:#faf8f5;border:1px solid #e7e2d9;border-radius:12px;padding:1rem;" hidden></div>

                <button type="submit" class="submit-btn" id="cr-submit">Register &amp; Open Category Dashboard</button>
            </form>
        </section>
    </main>

    <script src="/js/service-vendor-register.js?v=1"></script>
</body>
</html>
