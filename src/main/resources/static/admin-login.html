<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Entertainment World</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body data-role="ADMIN" data-endpoint="/api/auth/admin" data-mode="admin">
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="module-title">
            <a href="/index.html" class="back-link">&larr; All Modules</a>
            <header class="brand-header">
                <div class="brand-badge" aria-hidden="true">AD</div>
                <h1 id="module-title">Admin Portal</h1>
                <p class="brand-subtitle">Sign in with predefined administrator credentials</p>
            </header>

            <div id="status-banner" class="status-banner" role="alert" hidden></div>

            <form id="panel-login" class="auth-form" novalidate>
                <div class="field-group">
                    <label for="login-email">Admin Email</label>
                    <input type="email" id="login-email" placeholder="admin@entertainmentworld.com" autocomplete="email" required>
                </div>
                <div class="field-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <span class="demo-hint">Predefined Admin: <code>admin@entertainmentworld.com</code> / <code>admin123</code></span>
                <button type="submit" class="submit-btn" id="login-submit">Sign In to Admin</button>
            </form>
        </section>
    </main>
    <script src="/js/module-auth.js"></script>
</body>
</html>
