<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Influencer Login — Entertainment World</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body data-role="INFLUENCER" data-endpoint="/api/auth/influencer" data-mode="influencer">
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="module-title">
            <a href="/index.html" class="back-link">&larr; All Modules</a>
            <header class="brand-header">
                <div class="brand-badge" aria-hidden="true">IN</div>
                <h1 id="module-title">Influencer Portal</h1>
                <p class="brand-subtitle">Brand collaborations, media kits &amp; event launches</p>
            </header>

            <div class="tab-bar" role="tablist" aria-label="Influencer authentication">
                <button type="button" id="tab-login" class="tab-btn active" role="tab" aria-selected="true" aria-controls="panel-login" data-tab="login">Sign In</button>
                <button type="button" id="tab-register" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-register" data-tab="register">Sign Up</button>
            </div>

            <div id="status-banner" class="status-banner" role="alert" hidden></div>

            <form id="panel-login" class="auth-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
                <div class="field-group">
                    <label for="login-email">Influencer Email</label>
                    <input type="email" id="login-email" placeholder="influencer@entertainmentworld.com" autocomplete="email" required>
                </div>
                <div class="field-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <span class="demo-hint">Demo: <code>influencer@entertainmentworld.com</code> / <code>influencer123</code></span>
                <button type="submit" class="submit-btn" id="login-submit">Sign In as Influencer</button>
            </form>

            <form id="panel-register" class="auth-form" role="tabpanel" aria-labelledby="tab-register" hidden novalidate>
                <div class="field-group">
                    <label for="register-name">Creator / Influencer Name</label>
                    <input type="text" id="register-name" placeholder="Priya Sharma" autocomplete="name" required>
                </div>
                <div class="field-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="creator@example.com" autocomplete="email" required>
                </div>
                <div class="field-row">
                    <div class="field-group">
                        <label for="register-phone">Phone</label>
                        <input type="tel" id="register-phone" placeholder="+91 9876501234">
                    </div>
                    <div class="field-group">
                        <label for="register-city">City</label>
                        <input type="text" id="register-city" placeholder="Bengaluru">
                    </div>
                </div>
                <div class="field-group">
                    <label for="register-bio">Social Links &amp; Bio</label>
                    <textarea id="register-bio" rows="2" placeholder="Instagram/YouTube handles, niche, follower count"></textarea>
                </div>
                <div class="field-group">
                    <label for="register-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="register-password" placeholder="Minimum 6 characters" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="register-password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <div class="field-group">
                    <label for="register-confirm">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="register-confirm" placeholder="Re-enter password" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="register-confirm" aria-label="Show password">Show</button>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="register-submit">Create Influencer Account</button>
            </form>
        </section>
    </main>
    <script src="/js/module-auth.js"></script>
</body>
</html>
