<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casting Productions Login — Entertainment World</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body data-role="CASTING" data-endpoint="/api/auth/casting" data-mode="document-verification">
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="module-title">
            <a href="/index.html" class="back-link">&larr; All Modules</a>
            <header class="brand-header">
                <div class="brand-badge" aria-hidden="true">CP</div>
                <h1 id="module-title">Casting Productions</h1>
                <p class="brand-subtitle">Casting calls, auditions &amp; talent shortlists</p>
            </header>

            <div class="tab-bar" role="tablist" aria-label="Casting Productions authentication">
                <button type="button" id="tab-login" class="tab-btn active" role="tab" aria-selected="true" aria-controls="panel-login" data-tab="login">Sign In</button>
                <button type="button" id="tab-register" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-register" data-tab="register">Register &amp; Verify</button>
            </div>

            <div id="status-banner" class="status-banner" role="alert" hidden></div>

            <form id="panel-login" class="auth-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
                <div class="field-group">
                    <label for="login-email">Production Email</label>
                    <input type="email" id="login-email" placeholder="casting@entertainmentworld.com" autocomplete="email" required>
                </div>
                <div class="field-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <span class="demo-hint">Demo: <code>casting@entertainmentworld.com</code> / <code>casting123</code></span>
                <button type="submit" class="submit-btn" id="login-submit">Sign In to Casting</button>
            </form>

            <form id="panel-register" class="auth-form" role="tabpanel" aria-labelledby="tab-register" hidden novalidate>
                <div class="field-group">
                    <label for="register-name">Casting Director / Contact Name</label>
                    <input type="text" id="register-name" placeholder="Full Name" autocomplete="name" required>
                </div>
                <div class="field-group">
                    <label for="register-org">Production / Studio Name</label>
                    <input type="text" id="register-org" placeholder="Apex Casting Studio" autocomplete="organization" required>
                </div>
                <div class="field-group">
                    <label for="register-email">Production Email</label>
                    <input type="email" id="register-email" placeholder="team@studio.com" autocomplete="email" required>
                </div>
                <div class="field-row">
                    <div class="field-group">
                        <label for="register-doc-type">Document Type</label>
                        <select id="register-doc-type" required>
                            <option value="">-- Select --</option>
                            <option value="Production Registration">Production Registration</option>
                            <option value="Studio Incorporation">Studio Incorporation</option>
                            <option value="Guild / Association ID">Guild / Association ID</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label for="register-doc-number">Document Number</label>
                        <input type="text" id="register-doc-number" placeholder="CAST-2026-001" required>
                    </div>
                </div>
                <div class="field-group">
                    <label for="register-doc-file">Upload Verification Document (PDF / Image)</label>
                    <input type="file" id="register-doc-file" accept=".pdf,.png,.jpg,.jpeg" required>
                </div>
                <div class="field-group">
                    <label for="register-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="register-password" placeholder="Minimum 6 characters" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="register-password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <div class="field-group">
                    <label for="register-confirm">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="register-confirm" placeholder="Re-enter password" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="register-confirm" aria-label="Show password">Show</button>
                    </div>
                </div>
                <span class="demo-hint">Login is enabled after Admin verifies your submitted document.</span>
                <button type="submit" class="submit-btn" id="register-submit">Submit for Admin Verification</button>
            </form>
        </section>
    </main>
    <script src="/js/module-auth.js"></script>
</body>
</html>
