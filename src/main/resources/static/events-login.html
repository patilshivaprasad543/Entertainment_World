<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management Login — Entertainment World</title>
    <link rel="stylesheet" href="/css/auth.css?v=4">
</head>
<body data-role="EVENT_MANAGEMENT" data-endpoint="/api/auth/events" data-mode="document-verification">
    <nav class="ew-navbar">
        <a href="/index.html" class="ew-brand">
            <span class="ew-logo-box">★</span>
            <span class="ew-brand-text">
                <strong>Entertainment World</strong>
                <span>FIND STARDOM. FIND STARS.</span>
            </span>
        </a>
        <div class="ew-nav-links">
            <a href="/index.html">All Modules</a>
            <a href="/pricing.html">Pricing</a>
        </div>
        <div class="ew-nav-actions">
            <a href="/admin-login.html" class="ew-btn-outline">Super Admin</a>
            <a href="/actors-login.html" class="ew-btn-primary">Join Free</a>
        </div>
    </nav>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="module-title">
            <a href="/index.html" class="back-link">&larr; All Modules</a>
            <header class="brand-header">
                <div class="brand-badge" aria-hidden="true">EM</div>
                <h1 id="module-title">Event Management</h1>
                <p class="brand-subtitle">Live shows, premieres, award nights &amp; concerts</p>
            </header>

            <div class="tab-bar" role="tablist" aria-label="Event Management authentication">
                <button type="button" id="tab-login" class="tab-btn active" role="tab" aria-selected="true" aria-controls="panel-login" data-tab="login">Sign In</button>
                <button type="button" id="tab-register" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-register" data-tab="register">Register &amp; Verify</button>
            </div>

            <div id="status-banner" class="status-banner" role="alert" hidden></div>

            <form id="panel-login" class="auth-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
                <div class="field-group">
                    <label for="login-email">Event Agency Email</label>
                    <input type="email" id="login-email" placeholder="events@entertainmentworld.com" autocomplete="email" required>
                </div>
                <div class="field-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <span class="demo-hint">Demo: <code>events@entertainmentworld.com</code> / <code>events123</code></span>
                <button type="submit" class="submit-btn" id="login-submit">Sign In to Event Management</button>
            </form>

            <form id="panel-register" class="auth-form" role="tabpanel" aria-labelledby="tab-register" hidden novalidate>
                <div class="field-group">
                    <label for="register-name">Event Organizer / Contact Name</label>
                    <input type="text" id="register-name" placeholder="Full Name" autocomplete="name" required>
                </div>
                <div class="field-group">
                    <label for="register-org">Event Management Company</label>
                    <input type="text" id="register-org" placeholder="Starlight Event Management" autocomplete="organization" required>
                </div>
                <div class="field-group">
                    <label for="register-email">Agency Email</label>
                    <input type="email" id="register-email" placeholder="team@events.com" autocomplete="email" required>
                </div>
                <div class="field-row">
                    <div class="field-group">
                        <label for="register-doc-type">Document Type</label>
                        <select id="register-doc-type" required>
                            <option value="">-- Select --</option>
                            <option value="Event Management Permit">Event Management Permit</option>
                            <option value="Business License">Business License</option>
                            <option value="GST / Tax Certificate">GST / Tax Certificate</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label for="register-doc-number">Document Number</label>
                        <input type="text" id="register-doc-number" placeholder="EVT-2026-001" required>
                    </div>
                </div>
                <div class="field-group">
                    <label for="register-doc-file">Upload Verification Document (PDF / Image)</label>
                    <input type="file" id="register-doc-file" accept=".pdf,.png,.jpg,.jpeg" required>
                </div>
                <div class="field-group">
                    <label for="register-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="register-password" placeholder="Minimum 6 characters" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="register-password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <div class="field-group">
                    <label for="register-confirm">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="register-confirm" placeholder="Re-enter password" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="register-confirm" aria-label="Show password">Show</button>
                    </div>
                </div>
                <span class="demo-hint">Login is enabled after Admin verifies your submitted document.</span>
                <button type="submit" class="submit-btn" id="register-submit">Submit for Admin Verification</button>
            </form>
        </section>
    </main>
    <script src="/js/module-auth.js"></script>
</body>
</html>
